name: Build IQOO Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [ "v1.0", "phase-1-ci-candidate", "phase-2-daily-launcher" ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0"
      - run: gradle --no-daemon --console=plain --stacktrace testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IQOO-LAUNCHER-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
